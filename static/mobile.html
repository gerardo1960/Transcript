<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Transcript · Móvil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #0a0c10;
      --surface:  #111418;
      --border:   #1e2330;
      --muted:    #3a4055;
      --text:     #e8eaf0;
      --dim:      #6b7390;
      --accent:   #00e5ff;
      --sp0: #00e5ff;
      --sp1: #7cfc5e;
      --sp2: #ff7043;
      --sp3: #c77dff;
      --font-display: 'Syne', sans-serif;
      --font-mono:    'DM Mono', monospace;
      --font-ui:      'Inter', sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      padding-bottom: var(--safe-bottom);
    }

    /* ── Top bar ── */
    #topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    #topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 200ms ease;
    }
    #status-dot.connected { background: var(--sp1); box-shadow: 0 0 6px var(--sp1); }
    #status-dot.error     { background: var(--sp2); }

    #topbar-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    #topbar-title span { color: var(--accent); }

    #speaker-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
      background: var(--border);
      padding: 3px 8px;
      border-radius: 20px;
    }

    /* ── Now Speaking section ── */
    #now-speaking {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
    }

    #now-speaking-label {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #now-speaking-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 36px;
      align-items: center;
    }

    .speaking-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px 6px 8px;
      border-radius: 999px;
      border: 2px solid;
      background: transparent;
      transition: all 200ms ease;
    }

    .chip-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.75); }
    }

    .chip-name {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 800;
    }

    #now-speaking-empty {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Feed ── */
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    #feed::-webkit-scrollbar { width: 3px; }
    #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .feed-msg {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 10px;
    }

    .feed-msg.partial .feed-text {
      opacity: 0.5;
      font-style: italic;
    }

    .feed-ts {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--dim);
      flex-shrink: 0;
      min-width: 42px;
    }

    .feed-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .feed-colon {
      color: var(--dim);
      font-size: 14px;
      flex-shrink: 0;
    }

    .feed-text {
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.5;
      flex: 1;
      word-break: break-word;
      color: var(--text);
    }

    /* Most recent message: bigger */
    .feed-msg:last-child .feed-text {
      font-size: 16px;
      color: #fff;
    }

    .feed-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 13px;
      opacity: 0.5;
    }

    /* ── Auto-scroll button ── */
    #scroll-btn {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      right: 16px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--dim);
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10;
      transition: all 200ms ease;
    }
    #scroll-btn.visible { display: flex; }
    #scroll-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="topbar-left">
      <div id="status-dot"></div>
      <span id="topbar-title">LIVE <span>TRANSCRIPT</span></span>
    </div>
    <span id="speaker-count">— speakers</span>
  </header>

  <section id="now-speaking">
    <div id="now-speaking-label">Hablando ahora</div>
    <div id="now-speaking-chips">
      <span id="now-speaking-empty">Nadie hablando…</span>
    </div>
  </section>

  <div id="feed">
    <div class="feed-empty">Esperando voz…</div>
  </div>
</div>

<button id="scroll-btn" onclick="scrollToBottom(true)" title="Ir al final">↓</button>

<script>
  // ── Constants ───────────────────────────────────────────────────────────
  const COLORS = ['var(--sp0)', 'var(--sp1)', 'var(--sp2)', 'var(--sp3)'];
  const MAX_MSGS = 200;

  // ── State ───────────────────────────────────────────────────────────────
  const speakers   = {};   // device_id → { name, colorIdx }
  const speaking   = new Set();  // device_ids currently speaking
  const speakTimers = {};  // device_id → timeout handle (auto-clear)
  let   colorSeq   = 0;
  let   ws         = null;
  let   reconnectTimer = null;
  let   autoScroll = true;
  let   partials   = {};  // chunk_id → DOM element

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const feed       = document.getElementById('feed');
  const chips      = document.getElementById('now-speaking-chips');
  const emptyChip  = document.getElementById('now-speaking-empty');
  const scrollBtn  = document.getElementById('scroll-btn');

  // ── WebSocket ────────────────────────────────────────────────────────────
  function connect() {
    if (ws && ws.readyState <= 1) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen  = () => setStatus('connected');
    ws.onerror = () => setStatus('error');
    ws.onclose = () => {
      setStatus('disconnected');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onmessage = e => handle(JSON.parse(e.data));
  }

  function setStatus(s) {
    document.getElementById('status-dot').className = s === 'connected' ? 'connected' : s === 'error' ? 'error' : '';
  }

  // ── Message handler ──────────────────────────────────────────────────────
  function handle(msg) {
    switch (msg.type) {
      case 'init':
        initSpeakers(msg.data.speakers);
        if (msg.data.history) {
          Object.values(msg.data.history).flat()
            .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0))
            .forEach(e => appendMsg(e, false));
        }
        break;
      case 'speaker_added':    addSpeaker(msg.data); break;
      case 'speaker_removed':  removeSpeaker(msg.data.device_id); break;
      case 'speaker_renamed':  renameSpeaker(msg.data.device_id, msg.data.name); break;
      case 'speaker_active':   markSpeaking(msg.data.device_id, true); break;
      case 'speaker_inactive': markSpeaking(msg.data.device_id, false); break;
      case 'transcript':
        appendMsg(msg.data, false);
        markSpeaking(msg.data.device_id, true);
        break;
      case 'transcript_partial':
        appendMsg(msg.data, true);
        markSpeaking(msg.data.device_id, true);
        break;
      case 'transcript_update':
        updateMsg(msg.data);
        markSpeaking(msg.data.device_id, true);
        break;
      case 'transcript_remove':
        removeMsg(msg.data.chunk_id);
        break;
    }
  }

  // ── Speakers ─────────────────────────────────────────────────────────────
  function initSpeakers(list) {
    list.forEach(sp => addSpeaker(sp));
    updateCount();
  }

  function addSpeaker(sp) {
    if (!speakers[sp.device_id]) {
      speakers[sp.device_id] = { name: sp.name || 'Speaker', colorIdx: colorSeq++ % 4 };
    } else {
      speakers[sp.device_id].name = sp.name;
    }
    updateCount();
  }

  function removeSpeaker(id) {
    delete speakers[id];
    markSpeaking(id, false);
    updateCount();
  }

  function renameSpeaker(id, name) {
    if (speakers[id]) speakers[id].name = name;
    // Update any existing chip
    const chip = document.getElementById(`chip-${id}`);
    if (chip) chip.querySelector('.chip-name').textContent = name;
    // Update all feed entries for this speaker
    document.querySelectorAll(`[data-dev="${id}"] .feed-name`).forEach(el => el.textContent = name);
  }

  function updateCount() {
    document.getElementById('speaker-count').textContent =
      `${Object.keys(speakers).length} speakers`;
  }

  // ── Speaking state ────────────────────────────────────────────────────────
  function markSpeaking(id, active) {
    clearTimeout(speakTimers[id]);
    if (active) {
      speaking.add(id);
      speakTimers[id] = setTimeout(() => markSpeaking(id, false), 3000);
    } else {
      speaking.delete(id);
    }
    renderChips();
  }

  function renderChips() {
    // Remove all chips except the empty placeholder
    document.querySelectorAll('.speaking-chip').forEach(el => el.remove());
    emptyChip.style.display = speaking.size > 0 ? 'none' : '';

    speaking.forEach(id => {
      const sp = speakers[id];
      if (!sp) return;
      const color = COLORS[sp.colorIdx];
      const chip = document.createElement('div');
      chip.className = 'speaking-chip';
      chip.id = `chip-${id}`;
      chip.style.borderColor = color;
      chip.style.color = color;
      chip.innerHTML = `<span class="chip-dot"></span><span class="chip-name">${esc(sp.name)}</span>`;
      chips.appendChild(chip);
    });
  }

  // ── Feed ─────────────────────────────────────────────────────────────────
  function appendMsg(data, isPartial) {
    const sp = speakers[data.device_id];
    const name  = sp ? sp.name : (data.speaker_name || '?');
    const color = sp ? COLORS[sp.colorIdx] : 'var(--accent)';
    const ts    = fmtTime(data.timestamp);
    const text  = (data.text || '').trim();
    if (!text) return;

    // Remove empty-state placeholder
    const empty = feed.querySelector('.feed-empty');
    if (empty) empty.remove();

    // Trim to MAX_MSGS
    while (feed.children.length >= MAX_MSGS) feed.removeChild(feed.firstChild);

    const div = document.createElement('div');
    div.className = 'feed-msg' + (isPartial ? ' partial' : '');
    div.dataset.dev = data.device_id;
    if (data.chunk_id) {
      div.dataset.chunk = data.chunk_id;
      partials[data.chunk_id] = div;
    }
    div.innerHTML =
      `<span class="feed-ts">${ts}</span>` +
      `<span class="feed-name" style="color:${color}">${esc(name)}</span>` +
      `<span class="feed-colon">:</span>` +
      `<span class="feed-text">${esc(text)}</span>`;
    feed.appendChild(div);

    if (autoScroll) scrollToBottom();
  }

  function updateMsg(data) {
    const text = (data.text || '').trim();
    if (!text) return;
    const el = data.chunk_id ? partials[data.chunk_id] : null;
    if (!el) { appendMsg(data, true); return; }
    el.querySelector('.feed-text').textContent = text;
    if (!data.is_partial) {
      el.classList.remove('partial');
      delete partials[data.chunk_id];
    }
    if (autoScroll) scrollToBottom();
  }

  function removeMsg(chunkId) {
    const el = partials[chunkId];
    if (el) { el.remove(); delete partials[chunkId]; }
  }

  // ── Scroll ────────────────────────────────────────────────────────────────
  function scrollToBottom(force) {
    feed.scrollTop = feed.scrollHeight;
    if (force) {
      autoScroll = true;
      scrollBtn.classList.remove('visible');
    }
  }

  feed.addEventListener('scroll', () => {
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
    autoScroll = atBottom;
    scrollBtn.classList.toggle('visible', !atBottom);
  });

  // ── Helpers ───────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtTime(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  connect();
</script>
</body>
</html>
