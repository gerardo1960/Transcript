<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live Transcript · Móvil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --fs: 15px;
      --bg:       #0a0c10;
      --surface:  #111418;
      --border:   #1e2330;
      --muted:    #3a4055;
      --text:     #e8eaf0;
      --dim:      #6b7390;
      --accent:   #00e5ff;
      --sp0: #00e5ff;
      --sp1: #7cfc5e;
      --sp2: #ff7043;
      --sp3: #c77dff;
      --font-display: 'Syne', sans-serif;
      --font-mono:    'DM Mono', monospace;
      --font-ui:      'Inter', sans-serif;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100dvh;
      padding-bottom: var(--safe-bottom);
    }

    /* ── Top bar ── */
    #topbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      height: 48px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    @media (max-width: 400px) {
      #topbar {
        flex-wrap: wrap;
        height: auto;
        padding: 6px 12px;
        gap: 4px;
      }
      #topbar-left { flex: 1 1 100%; }
      #topbar-controls { flex: 1 1 100%; justify-content: space-between; }
    }

    #topbar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 1;
      min-width: 0;
    }

    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 200ms ease;
    }
    #status-dot.connected { background: var(--sp1); box-shadow: 0 0 6px var(--sp1); }
    #status-dot.error     { background: var(--sp2); }

    #topbar-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #topbar-title span { color: var(--accent); }

    #speaker-count {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
      background: var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid var(--accent);
      user-select: none;
      white-space: nowrap;
      transition: background 150ms ease;
    }
    #speaker-count:active { background: var(--accent); color: #000; }

    /* ── Feed ── */
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 10px 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 1px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    #feed::-webkit-scrollbar { width: 3px; }
    #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .feed-msg {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 10px;
    }

    .feed-msg.partial .feed-text {
      opacity: 0.5;
      font-style: italic;
    }

    .feed-ts {
      font-family: var(--font-mono);
      font-size: calc(var(--fs) * 0.67);
      color: var(--dim);
      flex-shrink: 0;
      min-width: 36px;
    }

    .feed-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--fs);
      flex-shrink: 0;
      white-space: nowrap;
      cursor: pointer;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }

    .feed-colon {
      color: var(--dim);
      font-size: var(--fs);
      flex-shrink: 0;
    }

    .feed-text {
      font-family: var(--font-mono);
      font-size: var(--fs);
      line-height: 1.5;
      flex: 0 0 100%;
      overflow-wrap: anywhere;
      color: var(--text);
      padding-left: 2px;
    }

    /* Most recent message: bigger */
    .feed-msg:last-child .feed-text {
      font-size: calc(var(--fs) * 1.07);
      color: #fff;
    }

    .feed-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 13px;
      opacity: 0.5;
    }

    /* ── Mics list sheet ── */
    #mics-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
    }
    #mics-overlay.open { display: flex; align-items: flex-end; }
    #mics-sheet {
      width: 100%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 70vh;
      overflow-y: auto;
    }
    #mics-sheet-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .mic-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--bg);
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .mic-row:active { opacity: 0.7; }
    .mic-serial {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      font-weight: 700;
      flex-shrink: 0;
      min-width: 28px;
    }
    .mic-name {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      flex: 1;
      color: var(--text);
    }
    .mic-name.unassigned { color: var(--muted); font-style: italic; font-weight: 400; }
    .mic-edit { color: var(--dim); font-size: 14px; flex-shrink: 0; }
    #mics-close {
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-family: var(--font-ui);
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: var(--border);
      color: var(--dim);
    }

    /* ── Rename modal ── */
    #rename-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 50;
    }
    #rename-overlay.open { display: flex; align-items: flex-end; }

    #rename-sheet {
      width: 100%;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px calc(20px + var(--safe-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #rename-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    #rename-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      padding: 12px 14px;
      outline: none;
      width: 100%;
    }
    #rename-input:focus { border-color: var(--accent); }

    #rename-actions {
      display: flex;
      gap: 10px;
    }

    .rename-btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 15px;
      font-family: var(--font-ui);
      font-weight: 600;
      cursor: pointer;
      border: none;
    }
    #rename-cancel { background: var(--border); color: var(--dim); }
    #rename-confirm { background: var(--accent); color: #000; }

    /* ── Auto-scroll button ── */
    #scroll-btn {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      right: 16px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--dim);
      font-size: 18px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      z-index: 10;
      transition: all 200ms ease;
    }
    #scroll-btn.visible { display: flex; }
    #scroll-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="topbar-left">
      <div id="status-dot"></div>
      <span id="topbar-title">LIVE TRANSCRIPT</span>
      <span id="speaker-count" onclick="openMics()" style="cursor:pointer"></span>
    </div>
    <div id="topbar-controls" style="display:flex;align-items:center;gap:8px;flex:1;max-width:220px">
      <span style="font-size:11px;color:var(--dim);font-family:var(--font-mono);flex-shrink:0">A</span>
      <input type="range" id="font-slider" min="12" max="26" value="15"
        style="flex:1;accent-color:#4caf50;cursor:pointer"
        oninput="changeFontSize(this.value)" />
      <span style="font-size:17px;color:var(--dim);font-family:var(--font-mono);flex-shrink:0">A</span>
      <button onclick="resetAllNames()" style="background:#f5c000;border:none;color:#000;border-radius:6px;padding:5px 8px;font-size:11px;font-family:var(--font-ui);font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0">↺</button>
    </div>
  </header>

  <div id="feed">
    <div class="feed-empty">Esperando voz…</div>
  </div>
</div>

<button id="scroll-btn" onclick="scrollToBottom(true)" title="Ir al final">↓</button>

<div id="mics-overlay" onclick="closeMics(event)">
  <div id="mics-sheet">
    <div id="mics-sheet-label">Micrófonos conectados</div>
    <div id="mics-list"></div>
    <button id="mics-close" onclick="closeMics()">Cerrar</button>
  </div>
</div>

<div id="rename-overlay" onclick="closeRename(event)">
  <div id="rename-sheet">
    <div id="rename-label">Nombre de la persona</div>
    <input id="rename-input" type="text" placeholder="Ej: Eduardo" autocomplete="off"
           onkeydown="if(event.key==='Enter') confirmRename()" />
    <div id="rename-actions">
      <button class="rename-btn" id="rename-cancel" onclick="closeRename()">Cancelar</button>
      <button class="rename-btn" id="rename-confirm" onclick="confirmRename()">Guardar</button>
    </div>
  </div>
</div>

<script>
  // ── Constants ───────────────────────────────────────────────────────────
  const COLORS = ['var(--sp0)', 'var(--sp1)', 'var(--sp2)', 'var(--sp3)'];
  const MAX_MSGS = 200;

  // ── State ───────────────────────────────────────────────────────────────
  const speakers   = {};   // device_id → { name, colorIdx }
  let   colorSeq   = 0;
  let   ws         = null;
  let   reconnectTimer = null;
  let   autoScroll = true;
  let   partials        = {};   // chunk_id → DOM element (pending partials)
  let   processedChunks = new Set();  // chunk_ids confirmed or removed

  // ── DOM refs ─────────────────────────────────────────────────────────────
  const feed       = document.getElementById('feed');
  const scrollBtn  = document.getElementById('scroll-btn');

  // ── WebSocket ────────────────────────────────────────────────────────────
  function connect() {
    if (ws && ws.readyState <= 1) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);

    ws.onopen  = () => setStatus('connected');
    ws.onerror = () => setStatus('error');
    ws.onclose = () => {
      setStatus('disconnected');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 2000);
    };
    ws.onmessage = e => handle(JSON.parse(e.data));
  }

  function setStatus(s) {
    document.getElementById('status-dot').className = s === 'connected' ? 'connected' : s === 'error' ? 'error' : '';
  }

  // ── Message handler ──────────────────────────────────────────────────────
  function handle(msg) {
    switch (msg.type) {
      case 'init':
        initSpeakers(msg.data.speakers);
        if (msg.data.history) {
          Object.values(msg.data.history).flat()
            .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0))
            .forEach(e => appendMsg(e, false));
        }
        break;
      case 'speaker_added':    addSpeaker(msg.data); break;
      case 'speaker_removed':  removeSpeaker(msg.data.device_id); break;
      case 'speaker_renamed':  renameSpeaker(msg.data.device_id, msg.data.name); break;
      case 'transcript':         appendMsg(msg.data, false); break;
      case 'transcript_partial': appendMsg(msg.data, true);  break;
      case 'transcript_update':  updateMsg(msg.data);        break;
      case 'transcript_remove':
        removeMsg(msg.data.chunk_id);
        break;
    }
  }

  // ── Speakers ─────────────────────────────────────────────────────────────
  function initSpeakers(list) {
    Object.keys(speakers).forEach(k => delete speakers[k]);
    list.forEach(sp => addSpeaker(sp));
    updateCount();
  }

  function addSpeaker(sp) {
    if (!speakers[sp.device_id]) {
      speakers[sp.device_id] = { name: sp.name || 'Speaker', serial: sp.serial || '', colorIdx: colorSeq++ % 4 };
    } else {
      speakers[sp.device_id].name = sp.name;
      if (sp.serial) speakers[sp.device_id].serial = sp.serial;
    }
    updateCount();
  }

  function removeSpeaker(id) {
    delete speakers[id];
    updateCount();
  }

  function renameSpeaker(id, name) {
    if (speakers[id]) speakers[id].name = name;
    document.querySelectorAll(`[data-dev="${id}"] .feed-name`).forEach(el => el.textContent = name);
  }

  // ── Rename modal ──────────────────────────────────────────────────────────
  async function openMics() {
    const list = await fetchSpeakers();
    const container = document.getElementById('mics-list');
    if (!list.length) {
      container.innerHTML = '<div style="color:var(--muted);font-family:var(--font-mono);font-size:13px;text-align:center;padding:12px">Sin micrófonos conectados</div>';
    } else {
      container.innerHTML = list.map(sp => {
        const serial = sp.serial || String(sp.device_id);
        const raw = sp.name || serial;
        const colonIdx = raw.indexOf(':');
        const personName = colonIdx >= 0 ? raw.slice(colonIdx + 1) : (raw === serial ? '' : raw);
        const display = personName || 'Sin asignar';
        const unassigned = !personName;
        return `<div class="mic-row" onclick="closeMics();openRename(${sp.device_id})">
          <span class="mic-serial">${serial}</span>
          <span class="mic-name${unassigned ? ' unassigned' : ''}">${display}</span>
          <span class="mic-edit">✎</span>
        </div>`;
      }).join('');
    }
    document.getElementById('mics-overlay').classList.add('open');
  }

  function closeMics(e) {
    if (e && e.target !== document.getElementById('mics-overlay')) return;
    document.getElementById('mics-overlay').classList.remove('open');
  }

  let _renameDeviceId = null;

  function openRename(deviceId) {
    _renameDeviceId = deviceId;
    const sp = speakers[deviceId];
    const input = document.getElementById('rename-input');
    // Pre-fill with the person name part if already renamed (after ":")
    const current = sp ? sp.name : '';
    const colonIdx = current.indexOf(':');
    input.value = colonIdx >= 0 ? current.slice(colonIdx + 1) : (current === (sp && sp.serial) ? '' : current);
    document.getElementById('rename-overlay').classList.add('open');
    setTimeout(() => input.focus(), 100);
  }

  function closeRename(e) {
    if (e && e.target !== document.getElementById('rename-overlay')) return;
    document.getElementById('rename-overlay').classList.remove('open');
    _renameDeviceId = null;
  }

  async function fetchSpeakers() {
    const res = await fetch('/api/speakers');
    const data = await res.json();
    return data.speakers;
  }

  async function resetAllNames() {
    const list = await fetchSpeakers();
    for (const sp of list) {
      if (sp.name === sp.serial) continue;
      await fetch('/api/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: sp.device_id, new_name: sp.serial }),
      }).catch(e => console.error('reset failed', e));
    }
  }

  async function confirmRename() {
    const input = document.getElementById('rename-input');
    const personName = input.value.trim();
    if (_renameDeviceId === null) { closeRename(); return; }
    // Get serial from server — reliable regardless of local dict state
    const list = await fetchSpeakers();
    const serverSp = list.find(s => s.device_id === _renameDeviceId);
    const serial = serverSp ? serverSp.serial : String(_renameDeviceId);
    // Empty name = reset to serial (e.g. "1L")
    const newName = personName ? (serial ? `${serial}:${personName}` : personName) : serial;
    document.getElementById('rename-overlay').classList.remove('open');
    try {
      await fetch('/api/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: _renameDeviceId, new_name: newName }),
      });
    } catch(e) { console.error('rename failed', e); }
    _renameDeviceId = null;
  }

  function updateCount() {
    const el = document.getElementById('speaker-count');
    if (!el) return;
    const mics = Object.keys(speakers).length;
    const named = Object.values(speakers).filter(sp => sp.name && sp.name !== sp.serial && !sp.name.endsWith(':') && sp.name !== '').length;
    el.innerHTML = `🎙${mics}&nbsp;&nbsp;<span style="color:var(--accent)"><svg width="11" height="11" viewBox="0 0 10 10" fill="currentColor" style="vertical-align:middle;margin-right:1px"><circle cx="5" cy="3" r="2"/><path d="M1 9.5c0-2.2 1.8-4 4-4s4 1.8 4 4"/></svg>${named}</span>`;
  }

  // ── Feed ─────────────────────────────────────────────────────────────────
  function appendMsg(data, isPartial) {
    const sp = speakers[data.device_id];
    const name  = sp ? sp.name : (data.speaker_name || '?');
    const color = sp ? COLORS[sp.colorIdx] : 'var(--accent)';
    const ts    = fmtTime(data.timestamp);
    const text  = (data.text || '').trim();
    if (!text) return;

    // Remove empty-state placeholder
    const empty = feed.querySelector('.feed-empty');
    if (empty) empty.remove();

    // Trim to MAX_MSGS — clean up partials ref so pruned nodes can be GC'd
    while (feed.children.length >= MAX_MSGS) {
      const removed = feed.firstChild;
      const cid = removed && removed.dataset && removed.dataset.chunk;
      if (cid && partials[cid] === removed) delete partials[cid];
      feed.removeChild(removed);
    }

    const div = document.createElement('div');
    div.className = 'feed-msg' + (isPartial ? ' partial' : '');
    div.dataset.dev = data.device_id;
    if (data.chunk_id) {
      if (isPartial && processedChunks.has(data.chunk_id)) return; // already confirmed/removed
      div.dataset.chunk = data.chunk_id;
      partials[data.chunk_id] = div;
    }
    div.innerHTML =
      `<span class="feed-ts">${ts}</span>` +
      `<span class="feed-name" style="color:${color}" onclick="openRename(${data.device_id})">${esc(name)}</span>` +
      `<span class="feed-colon">:</span>` +
      `<span class="feed-text">${esc(text)}</span>`;
    feed.appendChild(div);

    if (autoScroll) scrollToBottom();
  }

  function _trackProcessed(chunkId) {
    if (!chunkId) return;
    processedChunks.add(chunkId);
    if (processedChunks.size > 300) {
      processedChunks.delete(processedChunks.values().next().value);
    }
  }

  function updateMsg(data) {
    const text = (data.text || '').trim();
    if (!text) return;
    const el = data.chunk_id ? partials[data.chunk_id] : null;
    if (data.chunk_id) _trackProcessed(data.chunk_id);
    if (!el) { appendMsg(data, false); return; }  // no partial shown yet — add as confirmed
    el.querySelector('.feed-text').textContent = text;
    if (!data.is_partial) {
      el.classList.remove('partial');
      delete partials[data.chunk_id];
    }
    if (autoScroll) scrollToBottom();
  }

  function removeMsg(chunkId) {
    _trackProcessed(chunkId);
    const el = partials[chunkId];
    if (el) { el.remove(); delete partials[chunkId]; }
  }

  // ── Scroll ────────────────────────────────────────────────────────────────
  function scrollToBottom(force) {
    feed.scrollTop = feed.scrollHeight;
    if (force) {
      autoScroll = true;
      scrollBtn.classList.remove('visible');
    }
  }

  feed.addEventListener('scroll', () => {
    const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
    autoScroll = atBottom;
    scrollBtn.classList.toggle('visible', !atBottom);
  });

  // ── Helpers ───────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtTime(ts) {
    const d = ts ? new Date(ts * 1000) : new Date();
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${h}:${m}`;
  }

  function changeFontSize(size) {
    document.documentElement.style.setProperty('--fs', size + 'px');
    localStorage.setItem('mobile_font_size', size);
  }

  // Restore saved font size
  const savedSize = localStorage.getItem('mobile_font_size');
  if (savedSize) {
    document.getElementById('font-slider').value = savedSize;
    document.documentElement.style.setProperty('--fs', savedSize + 'px');
  }

  // ── Boot ─────────────────────────────────────────────────────────────────
  connect();
</script>
</body>
</html>
