<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Live Transcription</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ─── Design Tokens ──────────────────────────────────────────────── */
    :root {
      --bg:         #0a0c10;
      --surface:    #111418;
      --border:     #1e2330;
      --muted:      #3a4055;
      --text:       #e8eaf0;
      --text-dim:   #6b7390;
      --accent:     #00e5ff;

      /* Speaker palette — each speaker gets a distinct accent */
      --sp0: #00e5ff;   /* cyan     */
      --sp1: #7cfc5e;   /* lime     */
      --sp2: #ff7043;   /* coral    */
      --sp3: #c77dff;   /* violet   */

      --font-display: 'Syne', sans-serif;
      --font-mono:    'DM Mono', monospace;
      --font-ui:      'Inter', sans-serif;

      --radius: 16px;
      --gap:    12px;

      --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* ─── Layout ─────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
    }

    /* Top bar */
    #topbar {
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }

    #topbar-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--text);
    }

    #topbar-title span { color: var(--accent); }

    #status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--muted);
      transition: background var(--transition);
      margin-right: 8px;
    }
    #status-dot.connected { background: var(--sp1); box-shadow: 0 0 8px var(--sp1); }
    #status-dot.error     { background: var(--sp2); }

    #topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Speaker count badge */
    #speaker-badge {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      background: var(--border);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Settings toggle */
    #settings-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 8px;
      padding: 6px 12px;
      font-family: var(--font-ui);
      font-size: 13px;
      cursor: pointer;
      transition: all var(--transition);
    }
    #settings-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Speaker grid */
    #grid {
      flex: 1;
      display: grid;
      gap: var(--gap);
      padding: var(--gap);
      transition: grid-template-columns 0.4s ease, grid-template-rows 0.4s ease;
      overflow: hidden;
    }

    /* ─── Dynamic grid layouts ──────────────────────────────────────── */
    #grid[data-count="1"] {
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
    }
    #grid[data-count="2"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }
    #grid[data-count="3"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    /* 3-speaker: first panel spans full left column */
    #grid[data-count="3"] .speaker-panel:nth-child(1) {
      grid-row: 1 / 3;
    }
    #grid[data-count="4"] {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }

    /* ─── Speaker Panel ──────────────────────────────────────────────── */
    .speaker-panel {
      position: relative;
      background: var(--surface);
      border-radius: var(--radius);
      border: 2px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .speaker-panel.speaking {
      box-shadow: 0 0 0 2px var(--speaker-color), 0 0 30px -4px var(--speaker-color);
    }

    /* Accent strip at top */
    .speaker-panel::before {
      content: '';
      display: block;
      height: 4px;
      background: var(--speaker-color, var(--accent));
      flex-shrink: 0;
    }

    /* Panel header */
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }

    .speaker-name-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .speaker-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid var(--speaker-color, var(--accent));
      background: color-mix(in srgb, var(--speaker-color, var(--accent)) 12%, var(--surface));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 16px;
      color: var(--speaker-color, var(--accent));
      flex-shrink: 0;
    }

    .speaker-name {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background var(--transition);
    }
    .speaker-name:hover { background: var(--border); }

    /* Live indicator */
    .live-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .live-indicator.active {
      opacity: 1;
      color: var(--speaker-color, var(--accent));
    }
    .live-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    .panel-actions {
      display: flex;
      gap: 6px;
    }

    .panel-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      cursor: pointer;
      font-family: var(--font-ui);
      transition: all var(--transition);
    }
    .panel-btn:hover { border-color: var(--speaker-color); color: var(--speaker-color); }

    /* Language tag */
    .lang-tag {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      background: color-mix(in srgb, var(--speaker-color, var(--accent)) 15%, transparent);
      color: var(--speaker-color, var(--accent));
      border: 1px solid color-mix(in srgb, var(--speaker-color, var(--accent)) 30%, transparent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Transcription scroll area */
    .transcript-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
    }

    .transcript-area::-webkit-scrollbar { width: 4px; }
    .transcript-area::-webkit-scrollbar-track { background: transparent; }
    .transcript-area::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    /* Individual transcript entries */
    .transcript-entry {
      display: flex;
      flex-direction: column;
      gap: 4px;
      animation: slideIn 0.25s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .transcript-time {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.04em;
    }

    .transcript-text {
      font-family: var(--font-mono);
      font-size: clamp(15px, 2.2vw, 22px);
      line-height: 1.55;
      color: var(--text);
      word-break: break-word;
    }

    /* Most recent entry gets emphasis */
    .transcript-entry:last-child .transcript-text {
      color: white;
      font-size: clamp(17px, 2.5vw, 26px);
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      opacity: 0.25;
    }

    .empty-icon {
      font-size: 32px;
    }

    .empty-text {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
    }

    /* Waveform bar at the bottom of each panel */
    .waveform-bar {
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 0 16px;
      background: color-mix(in srgb, var(--speaker-color, var(--accent)) 4%, var(--surface));
      border-top: 1px solid var(--border);
    }

    .waveform-bar .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--speaker-color, var(--accent));
      opacity: 0.2;
      height: 4px;
      transition: height 80ms ease, opacity 80ms ease;
    }
    .speaker-panel.speaking .waveform-bar .bar {
      opacity: 0.7;
      animation: wave 0.6s ease-in-out infinite;
    }
    .speaker-panel.speaking .waveform-bar .bar:nth-child(2) { animation-delay: 0.08s; }
    .speaker-panel.speaking .waveform-bar .bar:nth-child(3) { animation-delay: 0.16s; }
    .speaker-panel.speaking .waveform-bar .bar:nth-child(4) { animation-delay: 0.24s; }
    .speaker-panel.speaking .waveform-bar .bar:nth-child(5) { animation-delay: 0.32s; }
    .speaker-panel.speaking .waveform-bar .bar:nth-child(6) { animation-delay: 0.14s; }
    .speaker-panel.speaking .waveform-bar .bar:nth-child(7) { animation-delay: 0.22s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50%       { height: 20px; }
    }

    /* ─── Settings Drawer ────────────────────────────────────────────── */
    #settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      backdrop-filter: blur(4px);
    }
    #settings-overlay.open { display: block; }

    #settings-drawer {
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: min(360px, 90vw);
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #settings-overlay.open #settings-drawer { transform: translateX(0); }

    .drawer-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 800;
    }

    .drawer-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .device-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .device-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 13px;
    }

    .device-name-txt {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
    }

    .drawer-close {
      margin-top: auto;
      background: var(--border);
      border: none;
      color: var(--text);
      border-radius: 10px;
      padding: 12px;
      font-family: var(--font-ui);
      font-size: 15px;
      cursor: pointer;
      transition: background var(--transition);
    }
    .drawer-close:hover { background: var(--muted); }

    /* ─── Rename inline edit ──────────────────────────────────────────── */
    .name-input {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 800;
      background: var(--border);
      color: var(--text);
      border: 1px solid var(--speaker-color, var(--accent));
      border-radius: 6px;
      padding: 2px 8px;
      outline: none;
      width: 160px;
    }

    /* ─── Toast notification ─────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 40px;
      font-size: 13px;
      font-family: var(--font-mono);
      z-index: 200;
      transition: transform 0.3s ease;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ─── Responsive ─────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #grid[data-count="2"],
      #grid[data-count="3"],
      #grid[data-count="4"] {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(auto-fill, minmax(200px, 1fr));
      }
      #grid[data-count="3"] .speaker-panel:nth-child(1) {
        grid-row: auto;
      }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- Top Bar -->
  <header id="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <div id="status-dot"></div>
      <span id="topbar-title">LIVE <span>TRANSCRIPT</span></span>
    </div>
    <div id="topbar-right">
      <span id="speaker-badge">— speakers</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:12px;color:var(--text-dim);font-family:var(--font-mono)">A</span>
        <input type="range" id="font-slider" min="36" max="72" value="36"
          style="width:80px;accent-color:var(--accent);cursor:pointer"
          oninput="changeFontSize(this.value)" />
        <span style="font-size:18px;color:var(--text-dim);font-family:var(--font-mono)">A</span>
      </div>
      <button id="settings-btn" onclick="openSettings()">⚙ Settings</button>
    </div>
  </header>

  <!-- Speaker Grid -->
  <main id="grid" data-count="0"></main>
</div>

<!-- Settings Overlay -->
<div id="settings-overlay" onclick="handleOverlayClick(event)">
  <div id="settings-drawer">
    <div class="drawer-title">Settings</div>

    <div>
      <div class="drawer-section-title">Active Devices</div>
      <div id="device-list" class="device-list">
        <div style="color:var(--text-dim);font-size:13px">Loading…</div>
      </div>
    </div>

    <div>
      <div class="drawer-section-title">Display</div>
      <label style="display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer">
        <input type="checkbox" id="auto-scroll-toggle" checked onchange="toggleAutoScroll()" />
        Auto-scroll to latest
      </label>
    </div>

    <button class="drawer-close" onclick="closeSettings()">Close</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────
  const SPEAKER_COLORS = ['var(--sp0)', 'var(--sp1)', 'var(--sp2)', 'var(--sp3)'];
  const SPEAKER_INITIALS = {};    // device_id → initial letter
  const SPEAKER_INDEX = {};       // device_id → color index
  let speakerOrder = [];          // ordered device IDs
  let autoScroll = true;
  let ws = null;
  let reconnectTimer = null;
  let speakingTimers = {};        // device_id → timeout handle

  // ── WebSocket ──────────────────────────────────────────────────────────
  function connect() {
    if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
      return; // Already connected or connecting
    }
    const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${protocol}://${location.host}/ws`);

    ws.onopen = () => {
      setStatus('connected');
      clearTimeout(reconnectTimer);
      showToast('Connected');
    };

    ws.onclose = () => {
      setStatus('disconnected');
      connected_clients && connected_clients.discard && connected_clients.discard(ws);
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, 2000);
    };

    ws.onerror = () => setStatus('error');

    ws.onmessage = (evt) => {
      const msg = JSON.parse(evt.data);
      handleMessage(msg);
    };
  }

  function handleMessage(msg) {
    switch (msg.type) {
      case 'init':
        initSpeakers(msg.data.speakers, msg.data.history);
        break;
      case 'transcript':
        appendTranscript(msg.data);
        break;
      case 'speaker_added':
        addSpeakerPanel(msg.data);
        break;
      case 'speaker_removed':
        removeSpeakerPanel(msg.data.device_id);
        break;
      case 'speaker_renamed':
        renameSpeakerPanel(msg.data.device_id, msg.data.name);
        break;
      case 'history_cleared':
        clearPanelHistory(msg.data.device_id);
        break;
      case 'speaker_inactive':
        setPanelInactive(msg.data.device_id);
        break;
      case 'speaker_active':
        setPanelActive(msg.data.device_id);
        break;
    }
  }

  // ── Speakers ───────────────────────────────────────────────────────────
  function initSpeakers(speakers, history) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    speakerOrder = [];

    speakers.forEach((sp, i) => {
      SPEAKER_INDEX[sp.device_id] = i % 4;
      SPEAKER_INITIALS[sp.device_id] = (sp.name || 'S')[0].toUpperCase();
      speakerOrder.push(sp.device_id);
      grid.appendChild(buildPanel(sp));
    });

    updateGridLayout();

    // Populate history
    if (history) {
      Object.entries(history).forEach(([deviceId, entries]) => {
        entries.forEach(e => appendTranscript(e, false));
      });
    }

    updateSpeakerBadge();
    loadDeviceList();
  }

  function addSpeakerPanel(sp) {
    if (speakerOrder.includes(sp.device_id)) return;
    const idx = speakerOrder.length % 4;
    SPEAKER_INDEX[sp.device_id] = idx;
    SPEAKER_INITIALS[sp.device_id] = (sp.name || 'S')[0].toUpperCase();
    speakerOrder.push(sp.device_id);
    document.getElementById('grid').appendChild(buildPanel(sp));
    updateGridLayout();
    updateSpeakerBadge();
  }

  function removeSpeakerPanel(deviceId) {
    const panel = document.getElementById(`panel-${deviceId}`);
    if (panel) panel.remove();
    speakerOrder = speakerOrder.filter(id => id !== deviceId);
    updateGridLayout();
    updateSpeakerBadge();
  }

  function renameSpeakerPanel(deviceId, name) {
    const el = document.getElementById(`name-${deviceId}`);
    if (el) el.textContent = name;
    const av = document.getElementById(`avatar-${deviceId}`);
    if (av) av.textContent = name[0].toUpperCase();
    SPEAKER_INITIALS[deviceId] = name[0].toUpperCase();
  }

  function buildPanel(sp) {
    const colorIdx = SPEAKER_INDEX[sp.device_id] ?? 0;
    const color = SPEAKER_COLORS[colorIdx];
    const initial = (sp.name || 'S')[0].toUpperCase();

    const div = document.createElement('div');
    div.className = 'speaker-panel';
    div.id = `panel-${sp.device_id}`;
    div.style.setProperty('--speaker-color', color);

    div.innerHTML = `
      <div class="panel-header">
        <div class="speaker-name-wrap">
          <div class="speaker-avatar" id="avatar-${sp.device_id}">${initial}</div>
          <span class="speaker-name" id="name-${sp.device_id}"
                ondblclick="startRename(${sp.device_id})"
                title="Double-tap to rename">${sp.name}</span>
          <span style="font-family:var(--font-mono);font-size:14px;color:var(--speaker-color);margin-left:4px;opacity:0.8" title="Serial">#${sp.serial || sp.device_id}</span>
          <span class="lang-tag" id="lang-${sp.device_id}">—</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="live-indicator" id="live-${sp.device_id}">
            <div class="live-dot"></div>
            LIVE
          </div>
          <div class="panel-actions">
            <button class="panel-btn" onclick="clearPanel(${sp.device_id})" title="Clear">✕</button>
          </div>
        </div>
      </div>
      <div class="transcript-area" id="transcript-${sp.device_id}">
        <div class="empty-state" id="empty-${sp.device_id}">
          <div class="empty-icon">🎙</div>
          <div class="empty-text">Waiting for speech…</div>
        </div>
      </div>
      <div class="mic-controls">
        <div class="mic-control-row">
          <label>🎙 Ganancia</label>
          <input type="range" min="30" max="100" value="70"
            oninput="updateGain(${sp.device_id}, this.value)"
            onchange="setGain(${sp.device_id}, this.value)"
            id="gain-${sp.device_id}" />
          <span class="mic-control-val" id="gain-val-${sp.device_id}">70%</span>
        </div>
        <div class="mic-control-row">
          <label>🔇 Umbral ruido</label>
          <input type="range" min="1" max="50" value="10"
            oninput="updateGate(${sp.device_id}, this.value)"
            onchange="setGate(${sp.device_id}, this.value)"
            id="gate-${sp.device_id}" />
          <span class="mic-control-val" id="gate-val-${sp.device_id}">0.010</span>
        </div>
      </div>
      <div class="waveform-bar">
        ${Array.from({length: 9}, () => `<div class="bar"></div>`).join('')}
      </div>
    `;

    return div;
  }

  // ── Transcripts ────────────────────────────────────────────────────────
  function appendTranscript(data, animate = true) {
    const area = document.getElementById(`transcript-${data.device_id}`);
    if (!area) return;

    // Hide empty state
    const empty = document.getElementById(`empty-${data.device_id}`);
    if (empty) empty.style.display = 'none';

    // Update language tag
    const langEl = document.getElementById(`lang-${data.device_id}`);
    if (langEl && data.language) langEl.textContent = data.language.toUpperCase();

    // Create entry
    const entry = document.createElement('div');
    entry.className = 'transcript-entry';
    if (!animate) entry.style.animation = 'none';

    const ts = new Date(data.timestamp * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const currentSize = document.getElementById('font-slider').value;
    entry.innerHTML = `
      <div class="transcript-time">${ts}</div>
      <div class="transcript-text" style="font-size:${currentSize}px">${escapeHTML(data.text)}</div>
    `;

    area.appendChild(entry);

    // Cap entries in DOM
    const entries = area.querySelectorAll('.transcript-entry');
    if (entries.length > 40) entries[0].remove();

    if (autoScroll) area.scrollTop = area.scrollHeight;

    // Flash "speaking" state
    markSpeaking(data.device_id);
  }

  function markSpeaking(deviceId) {
    const panel = document.getElementById(`panel-${deviceId}`);
    const live  = document.getElementById(`live-${deviceId}`);
    if (panel) panel.classList.add('speaking');
    if (live)  live.classList.add('active');

    clearTimeout(speakingTimers[deviceId]);
    speakingTimers[deviceId] = setTimeout(() => {
      if (panel) panel.classList.remove('speaking');
      if (live)  live.classList.remove('active');
    }, 2500);
  }

  function clearPanel(deviceId) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type: 'clear_speaker', device_id: deviceId}));
    }
  }

  function clearPanelHistory(deviceId) {
    const area = document.getElementById(`transcript-${deviceId}`);
    if (!area) return;
    const entries = area.querySelectorAll('.transcript-entry');
    entries.forEach(e => e.remove());
    const empty = document.getElementById(`empty-${deviceId}`);
    if (empty) empty.style.display = '';
    const langEl = document.getElementById(`lang-${deviceId}`);
    if (langEl) langEl.textContent = '—';
    showToast('History cleared');
  }

  // ── Grid Layout ────────────────────────────────────────────────────────
  function updateGridLayout() {
    const count = Math.min(speakerOrder.length, 4);
    document.getElementById('grid').dataset.count = count || '0';
  }

  function updateSpeakerBadge() {
    document.getElementById('speaker-badge').textContent =
      `${speakerOrder.length} speaker${speakerOrder.length !== 1 ? 's' : ''}`;
  }

  // ── Rename ─────────────────────────────────────────────────────────────
  function startRename(deviceId) {
    const nameEl = document.getElementById(`name-${deviceId}`);
    if (!nameEl) return;
    const current = nameEl.textContent.trim();

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'name-input';
    input.value = current;
    input.style.setProperty('--speaker-color', SPEAKER_COLORS[SPEAKER_INDEX[deviceId] ?? 0]);

    nameEl.replaceWith(input);
    input.focus();
    input.select();

    const commit = async () => {
      const newName = input.value.trim() || current;
      try {
        await fetch('/api/rename', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({device_id: deviceId, new_name: newName}),
        });
      } catch (e) {
        console.error('Rename failed', e);
      }
      // The server broadcasts speaker_renamed → renameSpeakerPanel()
    };

    input.onblur = commit;
    input.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = current; input.blur(); }
    };
  }

  // ── Settings ───────────────────────────────────────────────────────────
  async function loadDeviceList() {
    try {
      const res = await fetch('/api/devices');
      const data = await res.json();
      const list = document.getElementById('device-list');
      list.innerHTML = '';

      data.devices.forEach(d => {
        const item = document.createElement('div');
        item.className = 'device-item';
        item.innerHTML = `
          <div>
            <div style="font-weight:500;font-size:13px">${escapeHTML(d.name)}</div>
            <div class="device-name-txt">${escapeHTML(d.pw_node_name)}${d.mac ? ' · ' + d.mac : ''}</div>
          </div>
          <span style="font-size:11px;color:${d.active ? 'var(--sp1)' : 'var(--text-dim)'}">
            ${d.active ? '● Active' : '○ Idle'}
          </span>
        `;
        list.appendChild(item);
      });
    } catch (e) {
      console.error('Failed to load devices', e);
    }
  }

  function openSettings() {
    loadDeviceList();
    document.getElementById('settings-overlay').classList.add('open');
  }

  function closeSettings() {
    document.getElementById('settings-overlay').classList.remove('open');
  }

  function handleOverlayClick(e) {
    if (e.target === document.getElementById('settings-overlay')) closeSettings();
  }

  function toggleAutoScroll() {
    autoScroll = document.getElementById('auto-scroll-toggle').checked;
  }

  // ── Status ─────────────────────────────────────────────────────────────
  function setStatus(state) {
    const dot = document.getElementById('status-dot');
    dot.className = '';
    if (state === 'connected')    dot.classList.add('connected');
    else if (state === 'error')   dot.classList.add('error');
  }

  // ── Toast ──────────────────────────────────────────────────────────────
  let toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // ── Utils ──────────────────────────────────────────────────────────────
  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ── Init ───────────────────────────────────────────────────────────────
  connect();

  // Reconnect when tab becomes visible again (after notification/suspend)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        clearTimeout(reconnectTimer);
        connect();
      }
    }
  });

  // Keep-alive ping
  setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({type: 'ping'}));
    }
  }, 20000);
</script>
</body>
</html>
